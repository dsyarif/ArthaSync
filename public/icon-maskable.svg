<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGradMask" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a231c" />
      <stop offset="45%" stop-color="#051712" />
      <stop offset="100%" stop-color="#020806" />
    </linearGradient>
    
    <radialGradient id="ambientGlowMask" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.45" />
      <stop offset="50%" stop-color="#06b6d4" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#020806" stop-opacity="0" />
    </radialGradient>

    <!-- Symbol Gradients -->
    <linearGradient id="leftAscentMask" x1="0%" y1="100%" x2="50%" y2="0%">
      <stop offset="0%" stop-color="#047857" />
      <stop offset="40%" stop-color="#059669" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>

    <linearGradient id="rightAscentMask" x1="100%" y1="100%" x2="50%" y2="0%">
      <stop offset="0%" stop-color="#065f46" />
      <stop offset="40%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>

    <linearGradient id="syncWaveGradMask" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="45%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>

    <linearGradient id="diamondGradMask" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="35%" stop-color="#fbbf24" />
      <stop offset="70%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="coreGlowMask" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="16" flood-color="#10b981" flood-opacity="0.5" />
    </filter>
    <filter id="shadowDepthMask" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.75" />
    </filter>
  </defs>

  <!-- 1. Full Bleed Background for Android Maskable Icons -->
  <rect width="512" height="512" fill="url(#bgGradMask)" />
  <rect width="512" height="512" fill="url(#ambientGlowMask)" />

  <!-- Safe Zone Scaling (Scaled by 0.78 centered at 256, 256) -->
  <g transform="translate(56.32, 56.32) scale(0.78)">
    <!-- Decorative Subtle Sync Orbit Ring -->
    <circle cx="256" cy="272" r="172" fill="none" stroke="#10b981" stroke-opacity="0.12" stroke-width="2.5" stroke-dasharray="8 12" />
    <circle cx="256" cy="272" r="140" fill="none" stroke="#06b6d4" stroke-opacity="0.08" stroke-width="2" />

    <!-- Main Emblem -->
    <g filter="url(#shadowDepthMask)">
      <!-- Left Ascent Pillar -->
      <path d="M 124 382 L 208 382 L 256 220 L 222 178 Z" fill="url(#leftAscentMask)" />
      <path d="M 124 382 L 158 382 L 236 195 L 222 178 Z" fill="#34d399" fill-opacity="0.25" />

      <!-- Right Ascent Pillar -->
      <path d="M 388 382 L 304 382 L 256 220 L 290 178 Z" fill="url(#rightAscentMask)" />
      <path d="M 388 382 L 354 382 L 276 195 L 290 178 Z" fill="#ffffff" fill-opacity="0.18" />

      <!-- Crossbar Shadow & Glowing Sync Ribbon -->
      <path d="M 152 308 C 210 338, 302 338, 360 308 C 342 278, 320 270, 256 270 C 192 270, 170 278, 152 308 Z" fill="#021a13" opacity="0.6" />
      <path d="M 154 300 C 205 328, 307 328, 358 300 C 345 284, 310 276, 256 276 C 202 276, 167 284, 154 300 Z" fill="url(#syncWaveGradMask)" filter="url(#coreGlowMask)" />
      <path d="M 168 296 C 212 318, 300 318, 344 296" stroke="#ffffff" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.75" />

      <!-- Sync Nodes -->
      <circle cx="160" cy="298" r="9" fill="#06b6d4" />
      <circle cx="160" cy="298" r="4.5" fill="#ffffff" />
      <circle cx="352" cy="298" r="9" fill="#34d399" />
      <circle cx="352" cy="298" r="4.5" fill="#ffffff" />

      <!-- Diamond Apex -->
      <polygon points="256,102 308,168 256,228 204,168" fill="url(#diamondGradMask)" filter="url(#coreGlowMask)" />
      <polygon points="256,102 308,168 256,182" fill="#fef08a" fill-opacity="0.6" />
      <polygon points="256,102 204,168 256,182" fill="#ffffff" fill-opacity="0.85" />
      <polygon points="204,168 256,228 256,182" fill="#059669" fill-opacity="0.5" />
      <polygon points="308,168 256,228 256,182" fill="#047857" fill-opacity="0.8" />
      <polygon points="256,140 262,168 256,196 250,168" fill="#ffffff" />
      <polygon points="228,168 256,162 284,168 256,174" fill="#ffffff" />
      <circle cx="256" cy="168" r="5" fill="#ffffff" />
      <circle cx="256" cy="102" r="3" fill="#ffffff" />
    </g>

    <text x="256" y="442" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="800" letter-spacing="7" fill="#10b981" fill-opacity="0.9">ARTHASYNC</text>
  </g>
</svg>
